user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log the route, not query strings, so accidental sensitive parameters stay out of logs.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;
    # Brotli is intentionally not added: the stock nginx image does not include it,
    # and adding another gateway for it would violate the single-entry boundary.

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    map $scheme $limedia_hsts {
        https "max-age=31536000";
        default "";
    }

    map $http_authorization $limedia_has_authorization {
        default 1;
        "" 0;
    }

    map $http_cookie $limedia_has_cookie {
        default 1;
        "" 0;
    }

    limit_req_zone $binary_remote_addr zone=limedia_list:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=limedia_derivative:20m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=limedia_stream:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=limedia_direct_url:10m rate=5r/s;
    limit_req_status 429;

    proxy_cache_path /var/cache/nginx/limedia
        levels=1:2
        keys_zone=limedia_derivatives:20m
        max_size=512m
        inactive=7d
        use_temp_path=off;

    server {
        listen 80;
        server_name _;

        include /etc/nginx/security-headers.conf;

        location = /healthz {
            access_log off;
            include /etc/nginx/security-headers.conf;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /api/docs {
            return 404;
        }

        location = /api/openapi.json {
            return 404;
        }

        location = /api/v1/memories {
            limit_req zone=limedia_list burst=20 nodelay;
            proxy_pass http://backend:8000;
            proxy_cache limedia_derivatives;
            proxy_cache_bypass $limedia_has_authorization $limedia_has_cookie;
            proxy_no_cache $limedia_has_authorization $limedia_has_cookie;
            proxy_cache_key "$scheme$request_method$host$uri$is_args$args";
            proxy_cache_valid 200 15s;
            proxy_cache_valid 404 5s;
        }

        location ~ ^/api/v1/memories/[^/]+/thumbnail$ {
            limit_req zone=limedia_derivative burst=40 nodelay;
            proxy_pass http://backend:8000;
            proxy_cache limedia_derivatives;
            proxy_cache_methods GET HEAD;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_revalidate on;
            proxy_cache_bypass $limedia_has_authorization $limedia_has_cookie;
            proxy_no_cache $limedia_has_authorization $limedia_has_cookie;
            # Version, size and Accept are part of the effective derivative identity.
            proxy_cache_key "$scheme$request_method$host$uri$is_args$args$http_accept";
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 30s;
        }

        location ~ ^/api/v1/memories/[^/]+/direct-url$ {
            limit_req zone=limedia_direct_url burst=10 nodelay;
            include /etc/nginx/security-headers.conf;
            proxy_pass http://backend:8000;
            proxy_cache off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location ~ ^/api/v1/memories/[^/]+/(?:file|stream)$ {
            limit_req zone=limedia_stream burst=10 nodelay;
            include /etc/nginx/security-headers.conf;
            proxy_pass http://backend:8000;
            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location /api/ {
            proxy_pass http://backend:8000;
        }

        location ~* \.(?:css|js|webp|avif|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
