user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    # Resolve the Docker service name at request/background time instead of at
    # config load, so nginx can start even while `backend` is not yet resolvable.
    resolver 127.0.0.11 valid=30s ipv6=off;

    upstream limedia_backend {
        # `resolve` + `zone` (nginx >= 1.27.3) re-resolve `backend` in the
        # background, so the peer list follows Docker DNS instead of pinning the
        # IP resolved once at startup.
        zone limedia_backend 64k;
        server backend:8000 resolve;
        keepalive 16;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log the route, not query strings, so accidental sensitive parameters stay out of logs.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    large_client_header_buffers 2 8k;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;
    # Brotli is intentionally not added: the stock nginx image does not include it,
    # and adding another gateway for it would violate the single-entry boundary.
    open_file_cache max=1000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # TLS 由外部负载均衡终结时经 X-Forwarded-Proto 透传；本机仅 80 监听，
    # 纯 http 响应按规范不发 HSTS（发也会被忽略）。
    map $http_x_forwarded_proto $limedia_hsts {
        https "max-age=31536000";
        default "";
    }

    map $http_authorization $limedia_has_authorization {
        default 1;
        "" 0;
    }

    map $http_cookie $limedia_has_cookie {
        default 1;
        "" 0;
    }

    # 随机洗牌响应不进网关缓存（与后端 no-store 语义对齐）：
    # 缓存键虽含 seed 不会串数据，但几乎不复用的键只会污染缓存区。
    map $arg_sort $limedia_random_sort {
        default 0;
        "random" 1;
    }

    map "$limedia_has_authorization$limedia_has_cookie$limedia_random_sort" $limedia_list_cache_control {
        default "no-store";
        "000" "public, max-age=15, stale-while-revalidate=30";
    }

    limit_req_zone $binary_remote_addr zone=limedia_list:10m rate=10r/s;
    # 管理登录是唯一凭证入口：网关级限流钝化分布式暴力尝试，
    # 与应用层的逐 IP 锁出叠加而不是替代。
    limit_req_zone $binary_remote_addr zone=limedia_admin_login:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=limedia_derivative:20m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=limedia_stream:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=limedia_direct_url:10m rate=5r/s;
    # 无专用分区的公开读端点（预热状态 20s 轮询 / 推荐 / 聚合计数），
    # 否则会落入无限制的 /api/ 兜底分支。
    limit_req_zone $binary_remote_addr zone=limedia_public_read:10m rate=20r/s;
    limit_req_status 429;

    # 网关自身产生的 429（limit_req）补 Retry-After；应用层 429 因
    # proxy_intercept_errors 默认关闭而原样透传，自带 Retry-After。
    error_page 429 = @limedia_rate_limited;

    # 缓存目录与 backend 的 NGINX_CACHE_ROOT 同卷同路径：
    # 后台的缓存统计与「清理 Nginx 缓存」才有真实对象。
    proxy_cache_path /app/data/nginx_cache
        levels=1:2
        keys_zone=limedia_derivatives:20m
        max_size=512m
        inactive=7d
        use_temp_path=off;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security-headers.conf;

        location = /healthz {
            access_log off;
            include /etc/nginx/security-headers.conf;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /api/docs {
            return 404;
        }

        location = /api/openapi.json {
            return 404;
        }

        location = /api/v1/memories {
            limit_req zone=limedia_list burst=20 nodelay;
            include /etc/nginx/security-headers.conf;
            proxy_pass http://limedia_backend;
            proxy_cache limedia_derivatives;
            proxy_cache_bypass $limedia_has_authorization $limedia_has_cookie $limedia_random_sort;
            proxy_no_cache $limedia_has_authorization $limedia_has_cookie $limedia_random_sort;
            proxy_cache_key "$scheme$request_method$host$uri$is_args$args";
            proxy_hide_header Cache-Control;
            add_header Cache-Control $limedia_list_cache_control always;
            proxy_cache_valid 200 15s;
            proxy_cache_valid 404 5s;
            proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
        }

        location = /api/v1/memories/preheat-status {
            limit_req zone=limedia_public_read burst=40 nodelay;
            include /etc/nginx/security-headers.conf;
            proxy_pass http://limedia_backend;
        }

        location = /api/v1/memories/recommend {
            limit_req zone=limedia_public_read burst=40 nodelay;
            include /etc/nginx/security-headers.conf;
            proxy_pass http://limedia_backend;
        }

        location = /api/v1/memories/public-counts {
            limit_req zone=limedia_public_read burst=40 nodelay;
            include /etc/nginx/security-headers.conf;
            proxy_pass http://limedia_backend;
        }

        location ~ ^/api/v1/memories/[^/]+/thumbnail$ {
            limit_req zone=limedia_derivative burst=40 nodelay;
            proxy_pass http://limedia_backend;
            proxy_cache limedia_derivatives;
            proxy_cache_methods GET HEAD;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_revalidate on;
            proxy_cache_bypass $limedia_has_authorization $limedia_has_cookie;
            proxy_no_cache $limedia_has_authorization $limedia_has_cookie;
            # Version, size and Accept are part of the effective derivative identity.
            proxy_cache_key "$scheme$request_method$host$uri$is_args$args$http_accept";
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 30s;
            proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
        }

        location ~ ^/api/v1/memories/[^/]+/direct-url$ {
            limit_req zone=limedia_direct_url burst=10 nodelay;
            include /etc/nginx/security-headers.conf;
            proxy_pass http://limedia_backend;
            proxy_cache off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location ~ ^/api/v1/memories/[^/]+/(?:file|stream)$ {
            limit_req zone=limedia_stream burst=10 nodelay;
            include /etc/nginx/security-headers.conf;
            proxy_pass http://limedia_backend;
            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location = /api/v1/admin/login {
            limit_req zone=limedia_admin_login burst=10 nodelay;
            include /etc/nginx/security-headers.conf;
            proxy_pass http://limedia_backend;
        }

        location /api/ {
            proxy_pass http://limedia_backend;
        }

        location @limedia_rate_limited {
            default_type application/json;
            add_header Retry-After "1" always;
            return 429 '{"detail":"请求过于频繁，请稍后重试"}';
        }

        location ~* \.(?:css|js|webp|avif|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
