<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Li&Media - 回忆库</title>
    <meta name="description" content="基于百度网盘存储的公开回忆库。" />
    <meta name="theme-color" content="#25786d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1110" media="(prefers-color-scheme: dark)" />
    <link data-trunk rel="css" href="/src/index.css" />
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <!-- 首帧防闪烁:主题初始化必须在 WASM 加载前完成(原 theme-init.ts)。 -->
    <script>
      (function () {
        // V1.5 暗夜档案馆:无存储偏好时默认深色(与 useTheme.ts 同一规则)。
        try {
          var stored = localStorage.getItem("limedia-theme");
          var theme = stored === "light" ? "light" : "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </body>
</html>
