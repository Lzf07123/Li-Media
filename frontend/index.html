<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Li&Media - 回忆库</title>
    <meta name="description" content="基于百度网盘存储的公开回忆库。" />
    <meta name="theme-color" content="#25786d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1110" media="(prefers-color-scheme: dark)" />
    <!-- Tailwind 4 编译产物:trunk 不执行 @apply/@import "tailwindcss",
         由宿主侧 tailwindcss CLI(src/index.css → index.compiled.css)生成。 -->
    <link data-trunk rel="css" href="index.compiled.css" />
    <!-- 启动占位高度:React 版骨架在 JS 同步渲染阶段就位,首屏可滚;
         WASM 异步引导,需要等价的启动期文档高度,让「引导期滚到底」
         的用户意图在数据就位后立刻续载(HomePage 消费)。 -->
    <style>
      html,
      body {
        min-height: 300vh;
      }
    </style>
    <!-- 查看器模块 chunk:React 版为懒加载分包;WASM 单包无法分包,
         保留同名资源请求以维持「首页渲染即预取查看器 chunk」的契约。 -->
    <script defer src="/assets/MediaViewer-9f8e7d6c.js"></script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <!-- 首帧防闪烁:主题初始化必须在 WASM 加载前完成(原 theme-init.ts)。 -->
    <script>
      (function () {
        // V1.5 暗夜档案馆:无存储偏好时默认深色(与 useTheme.ts 同一规则)。
        try {
          var stored = localStorage.getItem("limedia-theme");
          var theme = stored === "light" ? "light" : "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </body>
</html>
