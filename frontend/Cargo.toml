[package]
name = "limedia-frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
gloo-net = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlImageElement",
    "Storage", "Location", "History", "Navigator", "MediaQueryList",
    "Request", "RequestInit", "RequestMode", "Response", "Headers",
    "console", "Performance", "VisibilityState",
    "Url", "ScrollToOptions", "ScrollBehavior", "AbortController",
    "HtmlDetailsElement", "HtmlInputElement", "HtmlVideoElement", "HtmlCanvasElement",
    "IntersectionObserver", "IntersectionObserverInit", "IntersectionObserverEntry",
    "HtmlDivElement", "HtmlButtonElement", "HtmlTextAreaElement", "HtmlFormElement",
    "PointerEvent", "WheelEvent", "MediaError", "HtmlMediaElement", "Clipboard",
    "FocusOptions",
    "DomTokenList", "CssStyleDeclaration", "DomRect", "NodeList",
    "ScrollIntoViewOptions", "ScrollLogicalPosition", "AddEventListenerOptions",
    "MediaQueryListEvent", "ResizeObserver", "ResizeObserverEntry",
] }
console_error_panic_hook = "0.1"
send_wrapper = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
