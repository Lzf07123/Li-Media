services:
  # 单容器:Go 二进制内嵌前端产物,同时服务静态资源与 /api(默认方案)。
  # 双容器(nginx 反代)保留为 split profile:`docker compose --profile split up -d`。
  backend:
    image: ${APP_IMAGE_REGISTRY:-uhub.service.ucloud.cn/li-media/}limedia:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.single
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.m.daocloud.io/library/}
        RUST_IMAGE: ${RUST_IMAGE:-rust:1-slim}
        GO_IMAGE: ${GO_IMAGE:-golang:1.26-alpine}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    restart: unless-stopped
    env_file: .env
    environment:
      # Compose 只用 POSTGRES_* 生成连接串，避免 DATABASE_URL 与数据库密码失配。
      DATABASE_URL: ""
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-media}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-media}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      # 只采信来自 compose 内部网络的 X-Forwarded-For（split profile 的
      # nginx 在此网段）；外部直连请求按 RemoteAddr 计限流键，无法伪造。
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.31.0.0/24}
      BACKEND_MEMORY_LIMIT_BYTES: ${BACKEND_MEMORY_LIMIT_BYTES:-268435456}
    # 迁移内嵌于 Go 二进制(启动即自动推进到最新)。
    command: ["limedia"]
    ports:
      - "${HTTP_PORT:-8080}:8000"
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    networks:
      - limedia
    volumes:
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:8000/api/v1/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: ${IMAGE_REGISTRY:-docker.mirrors.ustc.edu.cn/library/}postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-media}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-media}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - effective_cache_size=128MB
      - -c
      - max_connections=20
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    networks:
      - limedia
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-media} -d ${POSTGRES_DB:-media}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: ${IMAGE_REGISTRY:-docker.mirrors.ustc.edu.cn/library/}redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis_data:/data
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    networks:
      - limedia
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

  # 双容器方案(可选):nginx 反代 + 前端镜像。默认栈不含它;
  # 需要网关级 proxy_cache 时 `docker compose --profile split up -d`。
  nginx:
    profiles: ["split"]
    # 镜像名跟随构建目录 frontend，避免与官方 nginx 镜像同名混淆。
    image: ${APP_IMAGE_REGISTRY:-uhub.service.ucloud.cn/li-media/}frontend:${APP_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.m.daocloud.io/library/}
        RUST_IMAGE: ${RUST_IMAGE:-rust:1-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.27-alpine}
    restart: unless-stopped
    ports:
      - "${SPLIT_HTTP_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    networks:
      - limedia
    volumes:
      # 网关缓存与 backend 的 NGINX_CACHE_ROOT 同卷同路径：
      # 后台「缓存占用」统计与清理才有真实对象。
      - nginx_cache:/app/data/nginx_cache
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backend_data:
  postgres_data:
  redis_data:
  nginx_cache:

# 显式命名网络：与宿主上其他 compose 项目的默认网络隔离。
# 固定子网供 TRUSTED_PROXY_CIDRS 判定 split profile 的 nginx 来源。
networks:
  limedia:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
          gateway: 172.31.0.1
