services:
  # 单容器:Go 二进制内嵌前端产物,同时服务静态资源与 /api。
  backend:
    image: ${APP_IMAGE_REGISTRY:-uhub.service.ucloud.cn/li-media/}limedia:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.single
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.m.daocloud.io/library/}
        RUST_IMAGE: ${RUST_IMAGE:-rust:1-slim}
        GO_IMAGE: ${GO_IMAGE:-golang:1.26-alpine}
        RUN_IMAGE: ${RUN_IMAGE:-alpine:3.20}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        APT_MIRROR: ${APT_MIRROR:-}
        RUSTUP_DIST_SERVER: ${RUSTUP_DIST_SERVER:-https://mirrors.ustc.edu.cn/rust-static}
        RUSTUP_UPDATE_ROOT: ${RUSTUP_UPDATE_ROOT:-https://mirrors.ustc.edu.cn/rust-static/rustup}
        CARGO_REGISTRY_MIRROR: ${CARGO_REGISTRY_MIRROR:-sparse+https://mirrors.ustc.edu.cn/crates.io-index/}
    restart: unless-stopped
    env_file: .env
    environment:
      # Compose 只用 POSTGRES_* 生成连接串，避免 DATABASE_URL 与数据库密码失配。
      DATABASE_URL: ""
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-media}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-media}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      # 前置反向代理需要按真实客户端限流时,填入代理来源网段
      # (逗号分隔 CIDR);留空则只按 RemoteAddr,不采信 X-Forwarded-For。
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      BACKEND_MEMORY_LIMIT_BYTES: ${BACKEND_MEMORY_LIMIT_BYTES:-268435456}
    # 迁移内嵌于 Go 二进制(启动即自动推进到最新)。
    command: ["limedia"]
    ports:
      - "${HTTP_PORT:-8080}:8000"
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    networks:
      - limedia
    volumes:
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:8000/api/v1/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: ${IMAGE_REGISTRY:-docker.m.daocloud.io/library/}postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-media}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-media}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - effective_cache_size=128MB
      - -c
      - max_connections=20
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    networks:
      - limedia
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-media} -d ${POSTGRES_DB:-media}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: ${IMAGE_REGISTRY:-docker.m.daocloud.io/library/}redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis_data:/data
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    networks:
      - limedia
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  backend_data:
  postgres_data:
  redis_data:

# 显式命名网络:与宿主上其他 compose 项目的默认网络隔离。
networks:
  limedia:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
          gateway: 172.31.0.1
