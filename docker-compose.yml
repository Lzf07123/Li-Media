services:
  backend:
    build:
      context: ./backend
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.mirrors.ustc.edu.cn/library/}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.ustc.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.ustc.edu.cn/pypi/simple}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://media:change-me@db:5432/media}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      NGINX_CACHE_ROOT: /app/data/nginx_cache
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      BACKEND_MEMORY_LIMIT_BYTES: ${BACKEND_MEMORY_LIMIT_BYTES:-268435456}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    volumes:
      - backend_data:/app/data
      - nginx_cache:/app/data/nginx_cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: ${IMAGE_REGISTRY:-docker.mirrors.ustc.edu.cn/library/}postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-media}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-media}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - effective_cache_size=128MB
      - -c
      - max_connections=20
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-media} -d ${POSTGRES_DB:-media}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: ${IMAGE_REGISTRY:-docker.mirrors.ustc.edu.cn/library/}redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis_data:/data
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    build:
      context: ./frontend
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.mirrors.ustc.edu.cn/library/}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://npmreg.mirrors.ustc.edu.cn/}
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backend_data:
  postgres_data:
  redis_data:
  nginx_cache:
