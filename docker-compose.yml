services:
  backend:
    # image 与 build 并存：本机构建会打上仓库标签；低配生产机执行
    # docker compose pull 直接拉取远端镜像，跳过构建。
    image: ${APP_IMAGE_REGISTRY:-uhub.service.ucloud.cn/li-media/}backend:${APP_IMAGE_TAG:-latest}
    build:
      context: ./backend
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.mirrors.ustc.edu.cn/library/}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.ustc.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.ustc.edu.cn/pypi/simple}
    restart: unless-stopped
    env_file: .env
    environment:
      # Compose 只用 POSTGRES_* 生成连接串，避免 DATABASE_URL 与数据库密码失配。
      DATABASE_URL: ""
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-media}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-media}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      NGINX_CACHE_ROOT: /app/data/nginx_cache
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      BACKEND_MEMORY_LIMIT_BYTES: ${BACKEND_MEMORY_LIMIT_BYTES:-268435456}
    # --proxy-headers：限流键与审计 IP 使用 nginx 传入的客户端真实 IP
    # （X-Forwarded-For），否则所有访客共享同一个代理源 IP。
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    networks:
      - limedia
    volumes:
      - backend_data:/app/data
      - nginx_cache:/app/data/nginx_cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: ${IMAGE_REGISTRY:-docker.mirrors.ustc.edu.cn/library/}postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-media}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-media}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - effective_cache_size=128MB
      - -c
      - max_connections=20
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    networks:
      - limedia
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-media} -d ${POSTGRES_DB:-media}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: ${IMAGE_REGISTRY:-docker.mirrors.ustc.edu.cn/library/}redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis_data:/data
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    networks:
      - limedia
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    # 镜像名跟随构建目录 frontend，避免与官方 nginx 镜像同名混淆。
    image: ${APP_IMAGE_REGISTRY:-uhub.service.ucloud.cn/li-media/}frontend:${APP_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.mirrors.ustc.edu.cn/library/}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://npmreg.mirrors.ustc.edu.cn/}
        NPM_FALLBACK_REGISTRY: ${NPM_FALLBACK_REGISTRY:-https://registry.npmmirror.com/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    networks:
      - limedia
    volumes:
      # 网关缓存与 backend 的 NGINX_CACHE_ROOT 同卷同路径：
      # 后台「缓存占用」统计与清理才有真实对象。
      - nginx_cache:/app/data/nginx_cache
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 容器内测试入口（不随生产栈启动）：backend/Dockerfile 的 test target
  # 在 runtime 之上补装 pytest。用法：
  #   docker compose --profile dev run --rm backend-test            # 全量
  #   docker compose --profile dev run --rm backend-test pytest tests/test_x.py -q
  backend-test:
    image: ${APP_IMAGE_REGISTRY:-uhub.service.ucloud.cn/li-media/}backend-test:${APP_IMAGE_TAG:-latest}
    build:
      context: ./backend
      target: test
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.mirrors.ustc.edu.cn/library/}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.ustc.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.ustc.edu.cn/pypi/simple}
    profiles: ["dev"]
    command: pytest -q
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    networks:
      - limedia

volumes:
  backend_data:
  postgres_data:
  redis_data:
  nginx_cache:

# 显式命名网络：与宿主上其他 compose 项目的默认网络隔离。
networks:
  limedia:
    driver: bridge
